<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIKP-Lanud - Executive Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lanud: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVG Icons (Inline for standalone compatibility) ---
        const Icons = {
            Dashboard: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            CheckSquare: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Bell: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        };

        // --- Mock Data from PRD Section 9 ---
        const MOCK_DATA = {
            kpis: [
                { id: 'total', label: 'Total Personel', value: '842', trend: '+2', trendUp: true, color: 'bg-lanud-900', icon: 'Users' },
                { id: 'present', label: 'Hadir Hari Ini', value: '761', trend: '97.8%', trendUp: true, color: 'bg-green-600', icon: 'CheckSquare' },
                { id: 'late', label: 'Terlambat', value: '34', trend: '-2', trendUp: true, color: 'bg-amber-500', icon: 'Clock' },
                { id: 'leave', label: 'Cuti / Izin', value: '27', trend: '18 Cuti, 9 Izin', trendUp: false, color: 'bg-blue-500', icon: 'FileText' },
                { id: 'duty', label: 'Dinas Luar', value: '21', trend: 'Sesuai Sprin', trendUp: true, color: 'bg-indigo-500', icon: 'Dashboard' },
                { id: 'missing', label: 'Belum Tap Masuk', value: '7', trend: 'Batas 07:30', trendUp: false, color: 'bg-red-600', icon: 'AlertCircle' },
            ],
            unitPerformance: [
                { unit: 'Skadron Teknik 021', total: 145, present: 138, late: 6, rate: '95.2%' },
                { unit: 'Skadron Operasi 011', total: 132, present: 129, late: 3, rate: '97.7%' },
                { unit: 'Dinas Personel', total: 48, present: 47, late: 1, rate: '97.9%' },
                { unit: 'Dinas Logistik', total: 63, present: 60, late: 2, rate: '95.2%' },
                { unit: 'Dinas Kesehatan', total: 39, present: 38, late: 0, rate: '97.4%' },
                { unit: 'Satuan Pengamanan', total: 97, present: 91, late: 8, rate: '93.8%' },
            ],
            feed: [
                { time: '07:07', name: 'Kopda Fajar Nugroho', unit: 'Satuan Pengamanan', event: 'Check In', type: 'normal' },
                { time: '07:05', name: 'PNS Hendra Saputra', unit: 'Dinas Logistik', event: 'Check In (Late)', type: 'late' },
                { time: '07:03', name: 'Serda Maya Puspita', unit: 'Dinas Personel', event: 'Check In', type: 'normal' },
                { time: '07:02', name: 'Praka Andi Wijaya', unit: 'Skadron Teknik 021', event: 'Check In', type: 'normal' },
            ],
            alerts: [
                { id: 1, text: '7 personel belum melakukan Check-In melewati batas waktu.', type: 'critical' },
                { id: 2, text: '5 personel belum Check-Out (sisa shift kemarin).', type: 'warning' },
                { id: 3, text: '4 pengajuan cuti menunggu persetujuan > 24 jam.', type: 'warning' },
                { id: 4, text: 'Device "Gerbang Utama 2" offline selama 12 menit.', type: 'critical' },
            ]
        };

        // --- Components ---

        const Sidebar = ({ activeTab, setActiveTab }) => {
            const menuItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'Dashboard' },
                { id: 'personnel', label: 'Data Personel', icon: 'Users' },
                { id: 'attendance', label: 'Data Kehadiran', icon: 'Clock' },
                { id: 'leave', label: 'Pengajuan Cuti/Izin', icon: 'FileText' },
                { id: 'approvals', label: 'Persetujuan', icon: 'CheckSquare' },
                { id: 'settings', label: 'Pengaturan Sistem', icon: 'Settings' },
            ];

            return (
                <div className="w-64 bg-lanud-900 text-white flex flex-col h-screen shadow-xl z-10 sticky top-0">
                    <div className="p-4 border-b border-lanud-700 flex flex-col justify-center items-center space-y-2">
                        <img 
                            src="LOGO-ATS-PANJANGABU.jpg" 
                            alt="Logo Lanud Atang Sendjaja" 
                            className="w-full h-auto object-contain rounded"
                        />
                        <div className="w-full text-center">
                            <h1 className="font-bold text-sm leading-tight text-white mt-1">Sistem Informasi Kehadiran Personel</h1>
                        </div>
                    </div>
                    <nav className="flex-1 py-4">
                        {menuItems.map(item => {
                            const Icon = Icons[item.icon];
                            const isActive = activeTab === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center space-x-3 px-6 py-3 transition-colors ${
                                        isActive ? 'bg-lanud-700 border-l-4 border-white' : 'hover:bg-lanud-700/50 border-l-4 border-transparent'
                                    }`}
                                >
                                    <Icon />
                                    <span className="font-medium text-sm">{item.label}</span>
                                </button>
                            )
                        })}
                    </nav>
                    <div className="p-4 border-t border-lanud-700">
                        <button className="flex items-center space-x-3 text-lanud-100 hover:text-white px-2 py-2 w-full transition-colors text-sm">
                            <Icons.LogOut />
                            <span>Keluar Sistem</span>
                        </button>
                    </div>
                </div>
            );
        };

        const TopBar = ({ role, setRole }) => {
            const [time, setTime] = useState(new Date().toLocaleTimeString('id-ID'));

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date().toLocaleTimeString('id-ID')), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <header className="bg-white shadow-sm border-b border-slate-200 h-16 flex items-center justify-between px-8 sticky top-0 z-10">
                    <div>
                        <h2 className="text-xl font-bold text-slate-800">Executive Dashboard</h2>
                    </div>
                    
                    <div className="flex items-center space-x-6">
                        <div className="text-sm text-slate-500 font-medium">
                            {new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} • {time} WIB
                        </div>
                        
                        <div className="flex items-center space-x-2 border-l border-r border-slate-200 px-4">
                            <span className="text-sm text-slate-500">Simulasi Peran:</span>
                            <select 
                                className="text-sm border-slate-300 rounded-md bg-slate-50 focus:ring-lanud-500 focus:border-lanud-500 p-1 font-medium"
                                value={role}
                                onChange={(e) => setRole(e.target.value)}
                            >
                                <option value="KL">Komandan Lanud</option>
                                <option value="OD">Operator Dispers</option>
                                <option value="KS">Komandan Skadron</option>
                            </select>
                        </div>

                        <button className="relative p-2 text-slate-400 hover:text-slate-600 transition-colors">
                            <Icons.Bell />
                            <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
                        </button>
                        
                        <div className="flex items-center space-x-2">
                            <div className="w-8 h-8 rounded-full bg-lanud-100 text-lanud-700 flex items-center justify-center font-bold text-sm">
                                {role}
                            </div>
                            <div className="text-sm text-slate-700 font-medium">
                                {role === 'KL' ? 'Marsma TNI Budi' : role === 'OD' ? 'PNS Rina' : 'Letkol Pnb Adi'}
                            </div>
                        </div>
                    </div>
                </header>
            );
        };

        const KPICard = ({ data }) => {
            const Icon = Icons[data.icon];
            return (
                <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-shadow">
                    <div className="flex justify-between items-start">
                        <div>
                            <p className="text-sm font-medium text-slate-500 mb-1">{data.label}</p>
                            <h3 className="text-3xl font-bold text-slate-800">{data.value}</h3>
                        </div>
                        <div className={`w-10 h-10 rounded-lg flex items-center justify-center text-white ${data.color}`}>
                            <Icon />
                        </div>
                    </div>
                    <div className="mt-4 flex items-center text-sm">
                        <span className={`font-medium ${data.trendUp ? 'text-green-600' : 'text-slate-500'}`}>
                            {data.trend}
                        </span>
                        <span className="text-slate-400 ml-2">vs kemarin</span>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ role }) => {
            return (
                <div className="p-8 max-w-7xl mx-auto space-y-6">
                    {/* Welcome Banner */}
                    <div className="bg-lanud-900 rounded-xl p-6 text-white shadow-lg flex justify-between items-center bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
                        <div>
                            <h2 className="text-2xl font-bold mb-1">Pusat Informasi Kehadiran</h2>
                            <p className="text-lanud-100 text-sm opacity-90">Pemantauan real-time status personel Lanud Atang Sendjaja.</p>
                        </div>
                        <div className="bg-white/10 px-4 py-2 rounded-lg backdrop-blur-sm border border-white/20">
                            <span className="text-sm font-medium text-lanud-50 uppercase tracking-wider">Status Sistem:</span>
                            <span className="ml-2 inline-flex items-center text-green-400 text-sm font-bold">
                                <span className="w-2 h-2 rounded-full bg-green-400 mr-2 animate-pulse"></span> Online
                            </span>
                        </div>
                    </div>

                    {/* KPI Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                        {MOCK_DATA.kpis.map(kpi => <KPICard key={kpi.id} data={kpi} />)}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Unit Performance Table */}
                        <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                            <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                <h3 className="font-bold text-slate-800 flex items-center">
                                    <Icons.TrendingUp className="mr-2 h-5 w-5 text-lanud-500" />
                                    Performa Unit (Top 6)
                                </h3>
                                <button className="text-sm text-lanud-600 font-medium hover:text-lanud-800">Lihat Semua</button>
                            </div>
                            <div className="overflow-x-auto flex-1 p-0">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                        <tr>
                                            <th className="px-6 py-3 font-medium">Unit / Dinas</th>
                                            <th className="px-6 py-3 font-medium text-center">Total</th>
                                            <th className="px-6 py-3 font-medium text-center">Hadir</th>
                                            <th className="px-6 py-3 font-medium text-center">Terlambat</th>
                                            <th className="px-6 py-3 font-medium text-right">Persentase</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {MOCK_DATA.unitPerformance.map((unit, i) => (
                                            <tr key={i} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                                <td className="px-6 py-3 font-medium text-slate-800">{unit.unit}</td>
                                                <td className="px-6 py-3 text-center text-slate-600">{unit.total}</td>
                                                <td className="px-6 py-3 text-center text-slate-600">{unit.present}</td>
                                                <td className="px-6 py-3 text-center">
                                                    <span className={`px-2 py-1 rounded text-xs font-medium ${unit.late > 5 ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-700'}`}>
                                                        {unit.late}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-3 text-right">
                                                    <div className="flex items-center justify-end space-x-2">
                                                        <div className="w-16 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div 
                                                                className={`h-full ${parseFloat(unit.rate) > 96 ? 'bg-green-500' : 'bg-amber-500'}`} 
                                                                style={{width: unit.rate}}
                                                            ></div>
                                                        </div>
                                                        <span className="font-bold text-slate-700 w-12">{unit.rate}</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Alerts & Feed Column */}
                        <div className="space-y-6 flex flex-col">
                            {/* Alerts Panel */}
                            <div className="bg-white rounded-xl border border-slate-200 shadow-sm">
                                <div className="p-4 border-b border-slate-100 flex items-center bg-red-50/30 rounded-t-xl">
                                    <Icons.AlertCircle className="text-red-500 mr-2" />
                                    <h3 className="font-bold text-slate-800">Perhatian (Action Required)</h3>
                                </div>
                                <div className="p-2">
                                    {MOCK_DATA.alerts.map(alert => (
                                        <div key={alert.id} className="p-3 mb-1 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors flex items-start space-x-3">
                                            <div className={`mt-0.5 w-2 h-2 rounded-full flex-shrink-0 ${alert.type === 'critical' ? 'bg-red-500' : 'bg-amber-500'}`}></div>
                                            <p className="text-sm text-slate-700 leading-snug">{alert.text}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Real-time Feed */}
                            <div className="bg-white rounded-xl border border-slate-200 shadow-sm flex-1">
                                <div className="p-4 border-b border-slate-100 flex justify-between items-center">
                                    <h3 className="font-bold text-slate-800 flex items-center">
                                        <div className="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></div>
                                        Live Feed
                                    </h3>
                                </div>
                                <div className="p-4 space-y-4">
                                    {MOCK_DATA.feed.map((item, i) => (
                                        <div key={i} className="flex items-start space-x-3">
                                            <div className="text-xs font-mono text-slate-400 pt-1 w-10">{item.time}</div>
                                            <div className="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center flex-shrink-0 text-slate-500">
                                                <Icons.Users />
                                            </div>
                                            <div>
                                                <p className="text-sm font-medium text-slate-800">{item.name}</p>
                                                <p className="text-xs text-slate-500">{item.unit}</p>
                                                <span className={`inline-block mt-1 px-2 py-0.5 rounded text-xs font-medium ${item.type === 'late' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`}>
                                                    {item.event}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [role, setRole] = useState('KL'); // KL (Komandan), OD (Operator), KS (Skadron)

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
                    
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <TopBar role={role} setRole={setRole} />
                        
                        <main className="flex-1 overflow-y-auto scrollbar-hide pb-10">
                            {activeTab === 'dashboard' ? (
                                <Dashboard role={role} />
                            ) : (
                                <div className="flex h-full items-center justify-center flex-col text-slate-400 space-y-4">
                                    <Icons.Settings />
                                    <p className="text-lg font-medium">Modul "{activeTab}" sedang dalam pengembangan (Phase 2).</p>
                                    <p className="text-sm text-center max-w-md">Prototipe ini difokuskan pada Executive Dashboard sesuai instruksi PRD Bagian 9.</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
